<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <title>Check starten – VersicherungsFuchs</title>
  <meta name="robots" content="noindex">
<style>
/* CTA-Kontrast (Sven 07-23): weisse Schrift auf Orange erreichte nur 2.6 statt 4.5 (WCAG AA).
   Markenfarbe bleibt, Schrift wird dunkel -> ~7.5. Auch BFSG-relevant. */
.btn-primary,a.btn-primary,button.btn-primary,.nav-cta,.btn-cta,.cta-primary{color:#0a0a0f !important;}
.btn-primary svg,.nav-cta svg{stroke:#0a0a0f !important;}
</style>
<!-- Consent-Mode + Google Ads (Conversion-Messung). Default "denied";
     assets/js/cookie-notice.js hebt das nach Zustimmung per consent update auf. -->
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
gtag('consent','default',{'ad_storage':'denied','ad_user_data':'denied','ad_personalization':'denied','analytics_storage':'denied','functionality_storage':'granted','security_storage':'granted','wait_for_update':500});</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-820163824"></script>
<script>gtag('js',new Date());gtag('config','AW-820163824');</script>
<link rel="stylesheet" href="/assets/css/cookie-notice.css">
<script defer src="/assets/js/cookie-notice.js"></script>
</head>
<body>
<script>
  // Nicht-Riester-Checks führen zu ihrer eigenen ehrlichen Anfrage-Seite,
  // NICHT in den Riester-Fragebogen (kein Themen-Bait-and-Switch).
  var check = (new URLSearchParams(window.location.search).get('check') || '').toLowerCase();
  var NONRIESTER = { bu:1, rente:1, baufi:1, pkv:1 };
  if (NONRIESTER[check]) {
    window.location.replace('/check-anfrage/?check=' + check);
  } else {
    sessionStorage.removeItem('vf_answers');
    sessionStorage.removeItem('vf_lead');
    sessionStorage.removeItem('vf_lead_id');
    sessionStorage.removeItem('vf_cs');
    sessionStorage.removeItem('vf_payment_id');
    window.location.replace('/riester-check/q/?n=0');
  }
</script>
<noscript>
  <meta http-equiv="refresh" content="0;url=/riester-check/q/?n=0">
  <p>Bitte aktivieren Sie JavaScript oder <a href="/riester-check/q/?n=0">hier klicken</a>.</p>
</noscript>
</body>
</html>
